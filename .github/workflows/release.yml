name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Build & Release
    runs-on: macos-15          # Xcode 16, Swift 6, macOS 15 runner

    permissions:
      contents: write          # needed to create releases and push tags

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so we can read all tags

      # ── Determine next version ────────────────────────────────────────────
      - name: Bump version
        id: version
        run: |
          # Find the latest vX.Y.Z tag; default to v0.0.0 if none exists
          latest=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
          latest=${latest:-v0.0.0}

          major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
          minor=$(echo "$latest" | cut -d. -f2)
          patch=$(echo "$latest" | cut -d. -f3)

          # Collect all commits since the last tag (or all commits if no tag yet)
          if [ "$latest" = "v0.0.0" ]; then
            commits=$(git log --format="%s" 2>/dev/null || true)
          else
            commits=$(git log "${latest}..HEAD" --format="%s" 2>/dev/null || true)
          fi

          # Determine bump type from conventional commit messages:
          #   BREAKING CHANGE or !: → major
          #   feat:                 → minor
          #   fix: / anything else  → patch
          bump="patch"
          while IFS= read -r msg; do
            if echo "$msg" | grep -qiE '(\bBREAKING[ -]CHANGE\b|^[a-z]+(\([^)]+\))?!:)'; then
              bump="major"
              break
            elif echo "$msg" | grep -qiE '^feat(\([^)]+\))?:'; then
              [ "$bump" != "major" ] && bump="minor"
            fi
          done <<< "$commits"

          echo "Bump type: $bump (based on commits since $latest)"

          case "$bump" in
            major) new_tag="v$((major + 1)).0.0" ;;
            minor) new_tag="v${major}.$((minor + 1)).0" ;;
            patch) new_tag="v${major}.${minor}.$((patch + 1))" ;;
          esac

          version="${new_tag#v}"
          echo "tag=$new_tag"          >> "$GITHUB_OUTPUT"
          echo "version=$version"      >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest"  >> "$GITHUB_OUTPUT"
          echo "Next release: $new_tag"

      # ── Generate changelog ────────────────────────────────────────────────
      - name: Generate changelog
        run: |
          prev="${{ steps.version.outputs.previous_tag }}"
          next="${{ steps.version.outputs.tag }}"

          if [ "$prev" = "v0.0.0" ]; then
            raw=$(git log --format="%s" 2>/dev/null || true)
          else
            raw=$(git log "${prev}..HEAD" --format="%s" 2>/dev/null || true)
          fi

          features=""
          fixes=""
          other=""

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qiE '^feat(\([^)]+\))?!?:'; then
              features="${features}- ${msg}\n"
            elif echo "$msg" | grep -qiE '^fix(\([^)]+\))?:'; then
              fixes="${fixes}- ${msg}\n"
            elif echo "$msg" | grep -qiE '^\bBREAKING[ -]CHANGE\b'; then
              features="${features}- ${msg}\n"
            else
              other="${other}- ${msg}\n"
            fi
          done <<< "$raw"

          {
            echo "## What's Changed in ${next}"
            echo ""
            if [ -n "$features" ]; then
              echo "### Features"
              printf "%b" "$features"
              echo ""
            fi
            if [ -n "$fixes" ]; then
              echo "### Bug Fixes"
              printf "%b" "$fixes"
              echo ""
            fi
            if [ -n "$other" ]; then
              echo "### Other"
              printf "%b" "$other"
              echo ""
            fi
            echo "---"
            echo ""
            echo "## Install"
            echo ""
            echo "1. Download **TimeTracker.dmg** below."
            echo "2. Open the DMG and drag \`TimeTracker.app\` to your Applications folder."
            echo "3. Bypass Gatekeeper on first launch (ad-hoc signed build — no Apple certificate)."
            echo ""
            echo "### Gatekeeper — first launch"
            echo ""
            echo "**Option A — System Settings** (macOS 14 Sonoma and later)"
            echo "1. Try to open the app — macOS will block it."
            echo "2. Open **System Settings → Privacy & Security** and scroll down."
            echo "3. Click **\"Open Anyway\"** next to TimeTracker and confirm with your password."
            echo ""
            echo "**Option B — Terminal** (any macOS version)"
            echo '```bash'
            echo "xattr -dr com.apple.quarantine /Applications/TimeTracker.app"
            echo '```'
            echo "Then open the app normally. You only need to do this once."
            echo ""
            echo "> For a fully trusted build with no Gatekeeper prompt, the app must be signed with a Developer ID certificate and notarized with Apple."
          } > /tmp/RELEASE_NOTES.md

      # ── Cache SPM dependencies ────────────────────────────────────────────
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build release binary
        run: swift build -c release

      # ── Assemble .app bundle ──────────────────────────────────────────────
      - name: Assemble .app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_NAME="TimeTracker"
          BUNDLE_ID="com.wiseelf.timetracker"
          APP_DIR="dist/${APP_NAME}.app"
          CONTENTS="${APP_DIR}/Contents"
          MACOS_DIR="${CONTENTS}/MacOS"
          RES_DIR="${CONTENTS}/Resources"

          rm -rf dist
          mkdir -p "$MACOS_DIR" "$RES_DIR"
          cp ".build/release/${APP_NAME}" "$MACOS_DIR/${APP_NAME}"

          # Copy compiled asset catalog resources (icon)
          RESOURCES_BUILD=".build/release/TimeTracker_TimeTracker.bundle/Contents/Resources"
          if [ -d "$RESOURCES_BUILD" ]; then
            cp -R "$RESOURCES_BUILD/." "$RES_DIR/"
          fi

          /usr/libexec/PlistBuddy -c "Add :CFBundleName             string '${APP_NAME}'"           "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable       string '${APP_NAME}'"           "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier       string '${BUNDLE_ID}'"          "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType      string 'APPL'"                  "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string '${VERSION}'"          "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion          string '${VERSION}'"            "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion   string '13.0'"                  "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSUIElement              bool   true"                    "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable  bool   true"                    "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconName         string 'AppIcon'"               "${CONTENTS}/Info.plist"

          # Ad-hoc sign (no certificate required)
          codesign --force --deep --sign - "$APP_DIR"

      # ── Package DMG ───────────────────────────────────────────────────────
      - name: Create DMG
        run: |
          hdiutil create -volname "TimeTracker" \
            -srcfolder dist/TimeTracker.app \
            -ov -format UDZO \
            dist/TimeTracker.dmg

      # ── Tag & Release ─────────────────────────────────────────────────────
      - name: Tag commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TimeTracker ${{ steps.version.outputs.tag }}
          body_path: /tmp/RELEASE_NOTES.md
          files: dist/TimeTracker.dmg
          draft: false
          prerelease: false
