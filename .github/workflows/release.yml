name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Build & Release
    runs-on: macos-15          # Xcode 16, Swift 6, macOS 15 runner

    permissions:
      contents: write          # needed to create releases and push tags

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so we can read all tags

      # ── Determine next version ────────────────────────────────────────────
      - name: Bump version
        id: version
        run: |
          # Find the latest vX.Y.Z tag; default to v0.0.0 if none exists
          latest=$(git tag --list 'v*.*.*' --sort=-version:refname | head -1)
          latest=${latest:-v0.0.0}

          major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
          minor=$(echo "$latest" | cut -d. -f2)
          patch=$(echo "$latest" | cut -d. -f3)

          # Collect all commits since the last tag (or all commits if no tag yet)
          if [ "$latest" = "v0.0.0" ]; then
            commits=$(git log --format="%s" 2>/dev/null || true)
          else
            commits=$(git log "${latest}..HEAD" --format="%s" 2>/dev/null || true)
          fi

          # Determine bump type from conventional commit messages:
          #   BREAKING CHANGE or !: → major
          #   feat:                 → minor
          #   fix: / anything else  → patch
          bump="patch"
          while IFS= read -r msg; do
            if echo "$msg" | grep -qiE '(\bBREAKING[ -]CHANGE\b|^[a-z]+(\([^)]+\))?!:)'; then
              bump="major"
              break
            elif echo "$msg" | grep -qiE '^feat(\([^)]+\))?:'; then
              [ "$bump" != "major" ] && bump="minor"
            fi
          done <<< "$commits"

          echo "Bump type: $bump (based on commits since $latest)"

          case "$bump" in
            major) new_tag="v$((major + 1)).0.0" ;;
            minor) new_tag="v${major}.$((minor + 1)).0" ;;
            patch) new_tag="v${major}.${minor}.$((patch + 1))" ;;
          esac

          version="${new_tag#v}"
          echo "tag=$new_tag"          >> "$GITHUB_OUTPUT"
          echo "version=$version"      >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest"  >> "$GITHUB_OUTPUT"
          echo "Next release: $new_tag"

      # ── Generate changelog ────────────────────────────────────────────────
      - name: Generate changelog
        run: |
          prev="${{ steps.version.outputs.previous_tag }}"
          next="${{ steps.version.outputs.tag }}"

          if [ "$prev" = "v0.0.0" ]; then
            raw=$(git log --format="%s" 2>/dev/null || true)
          else
            raw=$(git log "${prev}..HEAD" --format="%s" 2>/dev/null || true)
          fi

          features=""
          fixes=""
          other=""

          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -qiE '^feat(\([^)]+\))?!?:'; then
              features="${features}- ${msg}\n"
            elif echo "$msg" | grep -qiE '^fix(\([^)]+\))?:'; then
              fixes="${fixes}- ${msg}\n"
            elif echo "$msg" | grep -qiE '^\bBREAKING[ -]CHANGE\b'; then
              features="${features}- ${msg}\n"
            else
              other="${other}- ${msg}\n"
            fi
          done <<< "$raw"

          {
            echo "## What's Changed in ${next}"
            echo ""
            if [ -n "$features" ]; then
              echo "### Features"
              printf "%b" "$features"
              echo ""
            fi
            if [ -n "$fixes" ]; then
              echo "### Bug Fixes"
              printf "%b" "$fixes"
              echo ""
            fi
            if [ -n "$other" ]; then
              echo "### Other"
              printf "%b" "$other"
              echo ""
            fi
            echo "---"
            echo ""
            echo "## Install"
            echo ""
            echo "1. Download **TimeTracker.dmg** below."
            echo "2. Open the DMG and drag \`TimeTracker.app\` to your Applications folder."
            echo "3. Launch the app."
          } > /tmp/RELEASE_NOTES.md

      # ── Import signing certificate ────────────────────────────────────────
      - name: Import certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          echo "$DEVELOPER_ID_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm /tmp/cert.p12

      # ── Cache SPM dependencies ────────────────────────────────────────────
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build release binary
        run: swift build -c release

      # ── Assemble .app bundle ──────────────────────────────────────────────
      - name: Assemble .app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_NAME="TimeTracker"
          BUNDLE_ID="com.kaidalov.stt"
          APP_DIR="dist/${APP_NAME}.app"
          CONTENTS="${APP_DIR}/Contents"
          MACOS_DIR="${CONTENTS}/MacOS"
          RES_DIR="${CONTENTS}/Resources"

          rm -rf dist
          mkdir -p "$MACOS_DIR" "$RES_DIR"
          cp ".build/release/${APP_NAME}" "$MACOS_DIR/${APP_NAME}"

          # Build AppIcon.icns from source PNGs using iconutil (no Xcode required)
          APPICONSET="Sources/TimeTracker/Assets.xcassets/AppIcon.appiconset"
          ICONSET_DIR="/tmp/AppIcon.iconset"
          mkdir -p "$ICONSET_DIR"
          cp "${APPICONSET}/icon_16x16.png"     "${ICONSET_DIR}/icon_16x16.png"
          cp "${APPICONSET}/icon_32x32.png"     "${ICONSET_DIR}/icon_16x16@2x.png"
          cp "${APPICONSET}/icon_32x32.png"     "${ICONSET_DIR}/icon_32x32.png"
          cp "${APPICONSET}/icon_64x64.png"     "${ICONSET_DIR}/icon_32x32@2x.png"
          cp "${APPICONSET}/icon_128x128.png"   "${ICONSET_DIR}/icon_128x128.png"
          cp "${APPICONSET}/icon_256x256.png"   "${ICONSET_DIR}/icon_128x128@2x.png"
          cp "${APPICONSET}/icon_256x256.png"   "${ICONSET_DIR}/icon_256x256.png"
          cp "${APPICONSET}/icon_512x512.png"   "${ICONSET_DIR}/icon_256x256@2x.png"
          cp "${APPICONSET}/icon_512x512.png"   "${ICONSET_DIR}/icon_512x512.png"
          cp "${APPICONSET}/icon_1024x1024.png" "${ICONSET_DIR}/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET_DIR" -o "${RES_DIR}/AppIcon.icns"

          /usr/libexec/PlistBuddy -c "Add :CFBundleName             string '${APP_NAME}'"           "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable       string '${APP_NAME}'"           "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier       string '${BUNDLE_ID}'"          "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType      string 'APPL'"                  "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string '${VERSION}'"          "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion          string '${VERSION}'"            "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion   string '13.0'"                  "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSUIElement              bool   true"                    "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable  bool   true"                    "${CONTENTS}/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile         string 'AppIcon'"               "${CONTENTS}/Info.plist"

      # ── Sign ──────────────────────────────────────────────────────────────
      - name: Sign .app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --deep --sign "Developer ID Application: Serhii Kaidalov (${APPLE_TEAM_ID})" \
            --options runtime \
            --entitlements Sources/TimeTracker/TimeTracker.entitlements \
            dist/TimeTracker.app

      # ── Package DMG ───────────────────────────────────────────────────────
      - name: Create DMG
        run: |
          hdiutil create -volname "TimeTracker" \
            -srcfolder dist/TimeTracker.app \
            -ov -format UDZO \
            dist/TimeTracker.dmg

      # ── Notarize ──────────────────────────────────────────────────────────
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit dist/TimeTracker.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      # ── Staple ────────────────────────────────────────────────────────────
      - name: Staple notarization ticket
        run: xcrun stapler staple dist/TimeTracker.dmg

      # ── Tag & Release ─────────────────────────────────────────────────────
      - name: Tag commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TimeTracker ${{ steps.version.outputs.tag }}
          body_path: /tmp/RELEASE_NOTES.md
          files: dist/TimeTracker.dmg
          draft: false
          prerelease: false
